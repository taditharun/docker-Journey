name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: ls -la

      - name: Check application
        run: ls -la app

      - name: Build Docker image
        run: docker build -t docker-journey:test .

      - name: Verify Docker image
        run: docker image inspect docker-journey:test