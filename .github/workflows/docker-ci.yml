name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: ls -la

      - name: Check application
        run: ls -la app

      - name: Build Docker image
        run: docker build -t docker-journey:test .

      - name: Start Docker container
        run: docker run -d -p 8080:80 --name docker-web-test docker-journey:test

      - name: Test application
        run: curl --fail http://localhost:8080

      - name: Show container logs
        if: always()
        run: docker logs docker-web-test

      - name: Stop Docker container
        if: always()
        run: docker rm -f docker-web-test